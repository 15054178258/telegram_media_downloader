<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telegram Media Downloader</title>
  <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div class="brand-text">
        <h1>TG Media Downloader</h1>
        <span class="version" id="app_version">v-</span>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="speed-badge" title="total download speed">
        <span class="speed-icon">&#8595;</span>
        <span id="total_speed">0 B/s</span>
      </div>
      <button id="state_btn" class="state-btn" data-value="{{ download_state }}"
        onclick="toggleState(this)">pause</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat-card">
      <div class="stat-num" id="stat_downloading">0</div>
      <div class="stat-label">Downloading</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat_downloaded">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat_total_size">0 B</div>
      <div class="stat-label">Received</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat_uptime">-</div>
      <div class="stat-label">Uptime</div>
    </div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="downloading" onclick="switchTab('downloading')">Downloading</button>
    <button class="tab" data-tab="completed" onclick="switchTab('completed')">Completed</button>
    <button class="tab" data-tab="tasks" onclick="switchTab('tasks')">Tasks</button>
  </nav>

  <main>
    <div id="tab-downloading" class="tab-panel active">
      <div id="downloading_list" class="item-list"></div>
    </div>
    <div id="tab-completed" class="tab-panel">
      <div id="completed_list" class="item-list"></div>
    </div>
    <div id="tab-tasks" class="tab-panel">
      <div id="tasks_list" class="item-list"></div>
    </div>
  </main>

  <script>
    "use strict";

    const escapeHtml = (value) =>
      String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));

    const fmtUptime = (seconds) => {
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    };

    const barClass = (progress) => {
      if (progress >= 100) return "bar-green";
      if (progress > 30) return "bar-blue";
      return "bar-red";
    };

    async function fetchJSON(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`${response.status}`);
      return response.json();
    }

    async function toggleState(button) {
      try {
        const result = await fetchJSON(
          `set_download_state?state=${encodeURIComponent(button.dataset.value)}`
        );
        button.dataset.value = result;
        button.textContent = result;
      } catch (err) { /* keep old state */ }
    }

    /* ---------- tabs ---------- */

    const refreshers = {
      downloading: refreshDownloading,
      completed: refreshCompleted,
      tasks: refreshTasks,
    };
    let activeTab = "downloading";

    function switchTab(name) {
      activeTab = name;
      document.querySelectorAll(".tab").forEach((el) => {
        el.classList.toggle("active", el.dataset.tab === name);
      });
      document.querySelectorAll(".tab-panel").forEach((el) => {
        el.classList.toggle("active", el.id === `tab-${name}`);
      });
      refreshActiveTab();
    }

    function refreshActiveTab() {
      refreshers[activeTab]().catch(() => { });
    }

    /* ---------- downloading ---------- */

    async function refreshDownloading() {
      const items = await fetchJSON("get_download_list?already_down=false");
      const box = document.getElementById("downloading_list");
      if (!items.length) {
        box.innerHTML = `<div class="empty">No active downloads</div>`;
        return;
      }
      box.innerHTML = items.map((item) => `
        <div class="dl-card">
          <div class="dl-head">
            <span class="dl-name" title="${escapeHtml(item.save_path)}">${escapeHtml(item.filename)}</span>
            <span class="dl-size">${escapeHtml(item.total_size)}</span>
          </div>
          <div class="progress">
            <div class="bar ${barClass(item.download_progress)}"
                 style="width:${Math.min(item.download_progress, 100)}%"></div>
          </div>
          <div class="dl-meta">
            <span>#${escapeHtml(item.id)} &middot; ${escapeHtml(item.chat)}</span>
            <span>${item.download_progress}% &middot; ${escapeHtml(item.download_speed)}</span>
          </div>
        </div>`).join("");
    }

    /* ---------- completed ---------- */

    async function refreshCompleted() {
      const items = await fetchJSON("get_download_list?already_down=true");
      const box = document.getElementById("completed_list");
      const done = items.filter((item) => Number(item.download_progress) === 100);
      if (!done.length) {
        box.innerHTML = `<div class="empty">Nothing completed yet (this session)</div>`;
        return;
      }
      box.innerHTML = done.map((item) => `
        <div class="done-card">
          <div class="dl-head">
            <span class="dl-name">${escapeHtml(item.filename)}</span>
            <span class="dl-size">${escapeHtml(item.total_size)}</span>
          </div>
          <div class="done-path" title="${escapeHtml(item.save_path)}">${escapeHtml(item.save_path)}</div>
        </div>`).join("");
    }

    /* ---------- tasks (sqlite history) ---------- */

    const statusClass = {
      done: "badge-done",
      running: "badge-running",
      stopped: "badge-stopped",
    };

    async function refreshTasks() {
      const tasks = await fetchJSON("get_tasks");
      const box = document.getElementById("tasks_list");
      if (!tasks.length) {
        box.innerHTML = `<div class="empty">No bot tasks recorded</div>`;
        return;
      }
      box.innerHTML = tasks.map((task) => {
        const folder = task.custom_path
          ? `<div class="task-folder">&#128193; ${escapeHtml(task.custom_path)}</div>` : "";
        const filter = task.download_filter
          ? `<div class="task-filter">&#128269; ${escapeHtml(task.download_filter)}</div>` : "";
        const actions = [];
        if (task.status === "running") {
          actions.push(`<button class="btn-sm" onclick="taskAction(${task.id}, 'stop')">&#9209; Stop</button>`);
          actions.push(`<button class="btn-sm danger" onclick="taskAction(${task.id}, 'delete')">&#128465; Delete</button>`);
        } else if (task.status === "stopped") {
          actions.push(`<button class="btn-sm" onclick="taskAction(${task.id}, 'resume')">&#9654; Resume</button>`);
          actions.push(`<button class="btn-sm danger" onclick="taskAction(${task.id}, 'delete')">&#128465; Delete</button>`);
        } else {
          actions.push(`<button class="btn-sm" onclick="taskAction(${task.id}, 'resume')">&#8635; Run again</button>`);
          actions.push(`<button class="btn-sm danger" onclick="taskAction(${task.id}, 'delete')">&#128465; Delete</button>`);
        }
        return `
        <div class="task-card">
          <div class="dl-head">
            <span class="task-chat">chat ${escapeHtml(task.chat_id)}</span>
            <span class="badge ${statusClass[task.status] || ""}">${escapeHtml(task.status)}</span>
          </div>
          <div class="task-range">messages ${task.start_id} - ${task.end_id === 0 ? "end" : task.end_id}</div>
          ${folder}${filter}
          <div class="task-time">${escapeHtml(task.updated_at || "")}</div>
          <div class="task-actions">${actions.join("")}</div>
        </div>`;
      }).join("");
    }

    async function taskAction(id, action) {
      if (action === "delete" && !confirm("Delete this task record?")) return;
      try {
        const response = await fetch("task_action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, action: action }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || response.status);
      } catch (err) {
        alert(`Action failed: ${err.message}`);
      }
      refreshTasks().catch(() => { });
    }

    /* ---------- stats ---------- */

    async function refreshStats() {
      const stats = await fetchJSON("get_stats");
      document.getElementById("stat_downloading").textContent = stats.downloading_count;
      document.getElementById("stat_downloaded").textContent = stats.downloaded_count;
      document.getElementById("stat_total_size").textContent = stats.total_size;
      document.getElementById("stat_uptime").textContent = fmtUptime(stats.uptime);
      document.getElementById("total_speed").textContent = stats.download_speed;
      document.getElementById("app_version").textContent = `v${stats.version}`;
    }

    /* ---------- main loop ---------- */

    function tick() {
      refreshStats().catch(() => { });
      refreshActiveTab();
    }

    document.addEventListener("visibilitychange", () => {
      const indicator = window.__tdlTimer;
      if (document.hidden) {
        clearInterval(indicator);
        window.__tdlTimer = 0;
      } else if (!indicator) {
        tick();
        window.__tdlTimer = setInterval(tick, 1000);
      }
    });

    tick();
    window.__tdlTimer = setInterval(tick, 1000);
  </script>
</body>

</html>
